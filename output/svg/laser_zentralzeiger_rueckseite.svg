      .awa-line { fill: none; stroke: #2980B9; stroke-width: 0.4; stroke-dasharray: 2.5,1.2; }
      .awa-label { font-family: sans-serif; font-size: 2.0px; fill: #1B4F72; text-anchor: middle; dominant-baseline: central; }
      .title-text { font-family: sans-serif; font-weight: bold; font-size: 2.8px; fill: #2C3E50; text-anchor: middle; }
      .sub-text { font-family: sans-serif; font-size: 1.8px; fill: #7F8C8D; text-anchor: middle; }
      .shift-indicator { font-family: sans-serif; font-weight: bold; font-size: 2.2px; dominant-baseline: central; text-anchor: middle; }
      .sector-beat-stbd { fill: #2ECC71; fill-opacity: 0.22; stroke: #27AE60; stroke-width: 0.45; }
      .sector-beat-port { fill: #E74C3C; fill-opacity: 0.22; stroke: #C0392B; stroke-width: 0.45; }
      .sector-gybe-stbd { fill: #2ECC71; fill-opacity: 0.22; stroke: #27AE60; stroke-width: 0.45; }
      .sector-gybe-port { fill: #E74C3C; fill-opacity: 0.22; stroke: #C0392B; stroke-width: 0.45; }
      .start-line { stroke: #2980B9; stroke-width: 1.2; }
      .bias-tick { stroke: #2980B9; stroke-width: 0.4; }
      .bias-text { font-family: sans-serif; font-size: 1.9px; fill: #2980B9; text-anchor: middle; dominant-baseline: central; }
      .bias-subtext-green { font-family: sans-serif; font-weight: bold; font-size: 1.9px; fill: #27AE60; text-anchor: middle; dominant-baseline: central; }
      .bias-subtext-red { font-family: sans-serif; font-weight: bold; font-size: 1.9px; fill: #C0392B; text-anchor: middle; dominant-baseline: central; }
      .tack-label-stbd { font-family: sans-serif; font-weight: bold; font-size: 2.3px; fill: #27AE60; text-anchor: middle; dominant-baseline: central; }
      .tack-label-port { font-family: sans-serif; font-weight: bold; font-size: 2.3px; fill: #C0392B; text-anchor: middle; dominant-baseline: central; }
      .gybe-label-stbd { font-family: sans-serif; font-weight: bold; font-size: 2.3px; fill: #27AE60; text-anchor: middle; dominant-baseline: central; }
      .gybe-label-port { font-family: sans-serif; font-weight: bold; font-size: 2.3px; fill: #C0392B; text-anchor: middle; dominant-baseline: central; }
      .line-label { font-family: sans-serif; font-weight: bold; font-size: 2.2px; fill: #2980B9; text-anchor: middle; dominant-baseline: central; }
      .vmg-beat { fill: #E74C3C; stroke: #962D22; stroke-width: 0.3; }
      .vmg-run { fill: #2ECC71; stroke: #27AE60; stroke-width: 0.3; }
      .crossover-marker { fill: #9B59B6; stroke: #8E44AD; stroke-width: 0.35; }
