<svg xmlns="http://www.w3.org/2000/svg" width="190.0mm" height="190.0mm" viewBox="-95.00 -95.00 190.00 190.00">
  <defs>
    <style>
      .laser-cut { fill: none; stroke: #E74C3C; stroke-width: 0.2; stroke-linecap: round; }
      .laser-cut-inner { fill: none; stroke: #C0392B; stroke-width: 0.2; stroke-linecap: round; }
      .laser-engrave { fill: none; stroke: #2C3E50; stroke-width: 0.35; }
      .grid-line { fill: none; stroke: #BDC3C7; stroke-width: 0.5; stroke-dasharray: 2.0,1.5; }
      .grid-line-minor { fill: none; stroke: #E5E7E9; stroke-width: 0.3; stroke-dasharray: 1.0,1.2; }
      .grid-text { font-family: sans-serif; font-size: 1.9px; fill: #2C3E50; text-anchor: middle; dominant-baseline: central; }
      .compass-tick { stroke: #2C3E50; stroke-width: 0.35; }
      .compass-text { font-family: sans-serif; font-weight: bold; font-size: 2.4px; fill: #2C3E50; text-anchor: middle; dominant-baseline: central; }
      .polar-curve { fill: none; stroke-width: 0.7; }
