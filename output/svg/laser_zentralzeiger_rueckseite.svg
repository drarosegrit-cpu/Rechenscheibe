  <!-- Schnittlinien (Laser-Cut) -->
  <circle cx="0" cy="0" r="1.60" class="laser-cut" />
  <path d="M 0 -5.0 L 0 -83.0 L -3.00 -86.0 L -6.00 -83.0 L -6.00 -5.0 A 5.0 5.0 0 1 0 0 -5.0 Z" class="laser-cut" />
  <line x1="0" y1="-5.00" x2="0" y2="-86.00" stroke="#E74C3C" stroke-width="0.35" />
